[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "nerf-replication"
version = "0.1.0"
description = "From-scratch PyTorch replication of NeRF (Mildenhall et al., 2020)"
requires-python = ">=3.10"
dependencies = ["torch>=2.2", "numpy>=1.26", "pillow>=10"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
