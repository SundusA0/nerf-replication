[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "nerf-replication"
version = "0.1.0"
description = "From-scratch PyTorch replication of NeRF (Mildenhall et al., 2020)"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.2", "numpy>=1.26", "pillow>=10",
    "lpips>=0.1.4",                        # scoring
    "scikit-image>=0.22", "scipy>=1.11",   # mesh extraction
]

[project.optional-dependencies]
dev = ["pytest>=8", "boto3>=1.34"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
